<svg viewBox="0 0 1400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#2EA5E9"/>
    </linearGradient>
    <linearGradient id="waveFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="300" fill="url(#bg)"/>

  <!-- animated wave layer 1 -->
  <path fill="url(#waveFill)">
    <animate attributeName="d" dur="2.5s" repeatCount="indefinite"
      values="
        M0,230 C 233,170 466,290 700,230 C 933,170 1166,290 1400,230 L1400,300 L0,300 Z;
        M0,230 C 233,290 466,170 700,230 C 933,290 1166,170 1400,230 L1400,300 L0,300 Z;
        M0,230 C 233,170 466,290 700,230 C 933,170 1166,290 1400,230 L1400,300 L0,300 Z
      "/>
  </path>

  <!-- animated wave layer 2 (front, lighter, faster) -->
  <path fill="#3fb6f5" opacity="0.55">
    <animate attributeName="d" dur="1.8s" repeatCount="indefinite"
      values="
        M0,260 C 233,220 466,300 700,260 C 933,220 1166,300 1400,260 L1400,300 L0,300 Z;
        M0,260 C 233,300 466,220 700,260 C 933,300 1166,220 1400,260 L1400,300 L0,300 Z;
        M0,260 C 233,220 466,300 700,260 C 933,220 1166,300 1400,260 L1400,300 L0,300 Z
      "/>
  </path>

  <!-- title text, fades in -->
  <text x="700" y="140" text-anchor="middle" font-family="Poppins, Segoe UI, sans-serif"
        font-size="44" font-weight="700" fill="#ffffff" opacity="0">
    Hi, I'm M. Dwijoyo Gustriando
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="1.2s" fill="freeze"/>
  </text>

  <!-- subtitle text, fades in slightly later -->
  <text x="700" y="185" text-anchor="middle" font-family="Poppins, Segoe UI, sans-serif"
        font-size="22" fill="#cfe8ff" opacity="0">
    Fullstack Developer  |  Informatics Student @ UII
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="1.2s" fill="freeze"/>
  </text>
</svg>
